version: '3.8'

services:
  # ----------------------------------------------------
  # 1. PostgreSQL Relational Database Service
  # ----------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: ds-wardrobe-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ds_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ds_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-ds_wardrobe}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ds_user} -d ${POSTGRES_DB:-ds_wardrobe}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ds-network

  # ----------------------------------------------------
  # 2. Redis Caching & Queue Service
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ds-wardrobe-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ds-network

  # ----------------------------------------------------
  # 3. Headless Commerce Backend API (Node.js/Express)
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ds-wardrobe-backend
    restart: unless-stopped
    environment:
      PORT: 8000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ds_user}:${POSTGRES_PASSWORD:-ds_password_2026}@db:5432/${POSTGRES_DB:-ds_wardrobe}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-ds_wardrobe_jwt_secret_dev_2026}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ds-network

  # ----------------------------------------------------
  # 4. Decoupled Next.js 16 Storefront Web App
  # ----------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    container_name: ds-wardrobe-frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - ds-network

# ------------------------------------------------------
# Named Volumes & Isolated Network
# ------------------------------------------------------
volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  backend_data:
    driver: local

networks:
  ds-network:
    driver: bridge
